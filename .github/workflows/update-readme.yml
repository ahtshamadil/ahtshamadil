name: Update Recent Contributions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and update recent contributions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = 'ahtshamadil';
            const query = `author:${username} is:pr is:merged -user:${username}`;

            core.info(`Searching: ${query}`);

            // Build query string manually and hit /search/issues directly,
            // so we bypass any quirks in Octokit's deprecated
            // search.issuesAndPullRequests wrapper.
            const url = `/search/issues?q=${encodeURIComponent(query)}&sort=updated&order=desc&per_page=10&advanced_search=true`;
            const response = await github.request(`GET ${url}`, {
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });
            const data = response.data;

            core.info(`Got total_count=${data.total_count}, items.length=${data.items.length}`);
            if (data.items.length > 0) {
              core.info(`First item: ${JSON.stringify({title: data.items[0].title, url: data.items[0].html_url}, null, 2)}`);
            }

            const lines = data.items.length === 0
              ? ['_No external merged PRs yet — the bot will fill this in once you have some._']
              : data.items.map(pr => {
                  const repo = pr.repository_url.replace('https://api.github.com/repos/', '');
                  const date = pr.pull_request && pr.pull_request.merged_at
                    ? pr.pull_request.merged_at.slice(0, 10)
                    : pr.closed_at
                      ? pr.closed_at.slice(0, 10)
                      : '';
                  const title = pr.title.replace(/\|/g, '\\|');
                  return `- \`${date}\` ✅ Merged [#${pr.number}: ${title}](${pr.html_url}) in [\`${repo}\`](https://github.com/${repo})`;
                });

            const block = [
              '<!--RECENT_ACTIVITY:start-->',
              '<!-- Auto-updated daily by .github/workflows/update-readme.yml -->',
              '',
              ...lines,
              '',
              '<!--RECENT_ACTIVITY:end-->'
            ].join('\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!--RECENT_ACTIVITY:start-->[\s\S]*?<!--RECENT_ACTIVITY:end-->/,
              block
            );

            if (updated === readme) {
              core.warning('No RECENT_ACTIVITY markers found (or content unchanged) — nothing to write.');
              return;
            }

            fs.writeFileSync('README.md', updated);
            core.info(`Wrote ${data.items.length} contribution(s) to README.md`);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update recent contributions [skip ci]"
            git push
          fi
