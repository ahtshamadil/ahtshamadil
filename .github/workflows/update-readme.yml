name: Update Recent Contributions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and update recent contributions
        uses: actions/github-script@v7
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = 'ahtshamadil';
            const query = `author:${username} is:pr is:merged -user:${username} is:public`;

            core.info(`Searching: ${query}`);

            // NOTE: The default GITHUB_TOKEN has a restricted search scope
            // and unauthenticated requests filter out author: results.
            // We need a real PAT — provided via the READ_TOKEN secret.
            const url = `https://api.github.com/search/issues?q=${encodeURIComponent(query)}&sort=updated&order=desc&per_page=10&advanced_search=true`;
            const response = await fetch(url, {
              headers: {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'ahtshamadil-profile-readme-updater',
                'Authorization': `Bearer ${process.env.READ_TOKEN}`
              }
            });

            if (!response.ok) {
              core.setFailed(`Search API failed: ${response.status} ${response.statusText}`);
              return;
            }

            const data = await response.json();
            core.info(`Got total_count=${data.total_count}, items.length=${data.items.length}`);

            const lines = data.items.length === 0
              ? ['_No external merged PRs yet — the bot will fill this in once you have some._']
              : data.items.map(pr => {
                  const repo = pr.repository_url.replace('https://api.github.com/repos/', '');
                  const date = pr.pull_request && pr.pull_request.merged_at
                    ? pr.pull_request.merged_at.slice(0, 10)
                    : pr.closed_at
                      ? pr.closed_at.slice(0, 10)
                      : '';
                  const title = pr.title.replace(/\|/g, '\\|');
                  return `- \`${date}\` ✅ Merged [#${pr.number}: ${title}](${pr.html_url}) in [\`${repo}\`](https://github.com/${repo})`;
                });

            const block = [
              '<!--RECENT_ACTIVITY:start-->',
              '<!-- Auto-updated daily by .github/workflows/update-readme.yml -->',
              '',
              ...lines,
              '',
              '<!--RECENT_ACTIVITY:end-->'
            ].join('\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!--RECENT_ACTIVITY:start-->[\s\S]*?<!--RECENT_ACTIVITY:end-->/,
              block
            );

            if (updated === readme) {
              core.warning('No RECENT_ACTIVITY markers found (or content unchanged) — nothing to write.');
              return;
            }

            fs.writeFileSync('README.md', updated);
            core.info(`Wrote ${data.items.length} contribution(s) to README.md`);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update recent contributions [skip ci]"
            git push
          fi
